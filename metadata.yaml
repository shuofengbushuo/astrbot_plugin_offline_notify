name: astrbot_plugin_offline_notify
display_name: AI下线通知系统
desc: 定时向QQ群发送AI服务下线提醒，支持LLM生成多样化通知、浮动时间、多群组、发布记录查询、管理员手动生成等
version: v1.3.0
author: AstrBot User
repo: https://github.com/shuofengbushuo/astrbot_plugin_offline_notify
tags:
  - 通知
  - 定时任务
  - 群管理
compatibility:
  min_astrbot_version: "4.0.0"
platforms:
  - aiocqhttp
  - qq
  - qq_official
features:
  - LLM生成多样化通知内容
  - 可配置的定时下线通知
  - 浮动时间机制（支持计划级覆盖）
  - 工作日/周末/特定日期差异化时间
  - 多群组同时通知
  - 自定义消息模板（LLM回退方案）
  - 通知预览功能（模板 + LLM 实时生成）
  - 发送失败重试机制（递增间隔）
  - 自我监控与告警（群聊+私聊双通道）
  - 调度器心跳检测
  - 通知发布记录持久化存储与查询
  - 管理员私聊手动生成并发送通知到指定群