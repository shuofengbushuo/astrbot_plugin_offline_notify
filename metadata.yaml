name: astrbot_plugin_offline_notify
display_name: AI下线通知系统
desc: 仅适配 QQ 官方机器人（qq_official / qq_official_webhook），以「被动窗口事件驱动」方式向 QQ 群发送 AI 服务下线提醒：QQ 官方群消息必须携带 5 分钟内的被动 msg_id 才能送达，故划定下线时间前后的时间窗口，窗口内检测到目标群发言即借被动 msg_id 触发发送；窗口内无人发言则本次不发送（无 msg_id 时适配器会静默丢弃，不再做无效的主动推送降级）。支持 LLM 以通用、中立的默认提示词生成离场通知（规避 AI/系统口吻与「XX:XX 下线」字眼，提示词可完全自定义）、窗口提前/延后与触发浮动全局可配置、多群组、发布记录查询、管理员手动生成、提示词可在配置面板完全自定义。长通知合并单条发送（规避官方频控）。定时计划支持通过 QQ 聊天命令（/下线通知 计划）可视化增删改与热重载，无需编辑 JSON 配置
version: v2.0.1
author: AstrBot User
repo: https://github.com/shuofengbushuo/astrbot_plugin_offline_notify
tags:
  - 通知
  - 定时任务
  - 群管理
compatibility:
  min_astrbot_version: "4.0.0"
platforms:
  - qq_official
  - qq_official_webhook
features:
  - 被动窗口事件驱动：QQ 官方群消息需 5 分钟内的被动 msg_id 才能送达，故划定下线时间前后窗口，窗口内目标群发言即借被动 msg_id 触发发送；窗口内无人发言则本次不发送
  - QQ官方机器人（qq_official）原生适配：openid 会话标识、被动 msg_id 窗口预警、长通知合并单条发送以规避官方频控、强制纯文本规避 Markdown 模板报备、发送静默失败真实上报（含适配器 skip 场景）
  - 平台自动识别：platform_id 配置错误时自动回退到唯一已启用的适配器，并给出修正建议
  - LLM生成多样化通知内容
  - 可配置的定时下线通知
  - 窗口提前开启 / 窗口延后关闭 / 触发时机浮动 全局可配置（触发浮动上限受被动 msg_id 5 分钟有效期约束）
  - 工作日/周末/特定日期差异化时间
  - 多群组同时通知
  - 自定义消息模板（LLM回退方案）
  - 通知预览功能（模板 + LLM 实时生成）
  - 发送失败重试机制（递增间隔）
  - 自我监控与告警（群聊+私聊双通道）
  - 调度器心跳检测
  - 通知发布记录持久化存储与查询
  - 管理员私聊手动生成并发送通知到指定群
  - 长通知合并单条发送（换行保留分句节奏，规避官方频控）
  - LLM通知以通用、中立的默认提示词生成离场说明，规避AI/系统口吻与「XX:XX下线」字眼（昼夜情境自然切换离开理由）
  - 提示词自定义：配置项 custom_prompt 可覆盖内置默认提示词（优先级：已激活命名方案 > 配置自定义 > 内置默认）
  - 定时计划命令管理：通过QQ聊天命令（/下线通知 计划）可视化增删改与热重载，无需编辑JSON配置；WebUI管理面板同步支持
